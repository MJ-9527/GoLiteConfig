services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: golite-etcd
    command:
      - etcd
      - --name=golite-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://localhost:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://golite-etcd:2380
      - --initial-cluster=golite-etcd=http://golite-etcd:2380
      - --initial-cluster-token=golite-config
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  etcd-data:
